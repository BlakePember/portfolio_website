<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Duckhouse — Online multiplayer chess variant combining Bughouse Chess and Duck Chess." />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Duckhouse — Bughouse × Duck Chess</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Dev helper: when opened via VS Code Live Server (static file server) instead of Vite,
      // automatically forward to the local Vite + Cloudflare dev server on port 5173.
      (function () {
        var isRawViteEntry = !!document.querySelector('script[src="/src/main.tsx"]');
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!isRawViteEntry || !isLocal || location.port === '5173') return;

        var devUrl = 'http://localhost:5173/' + (location.hash || '');
        fetch('http://localhost:5173/api/health')
          .then(function (r) {
            if (r.ok) location.replace(devUrl);
            else throw new Error('not ready');
          })
          .catch(function () {
            document.body.style.cssText =
              'margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111713;color:#eef3ea;font-family:system-ui,sans-serif;padding:24px;';
            document.getElementById('root').innerHTML =
              '<div style="max-width:480px;background:#18211b;border:1px solid #2c3a31;border-radius:16px;padding:24px;line-height:1.6;">' +
              '<h2 style="margin:0 0 8px;">Duckhouse Dev Server Not Running</h2>' +
              '<p style="margin:0 0 14px;color:#9aa89d;">Duckhouse is a React + Cloudflare Durable Objects app, so VS Code Live Server cannot compile <code>.tsx</code> files directly.</p>' +
              '<p style="margin:0 0 14px;">Run this command in your terminal, then click Retry:</p>' +
              '<pre style="background:#111713;padding:10px 12px;border-radius:8px;overflow:auto;color:#b8e986;">cd duckhouse\nnpm run dev</pre>' +
              '<div style="display:flex;gap:10px;margin-top:16px;">' +
              '<button onclick="location.reload()" style="padding:9px 14px;border-radius:9px;border:none;background:#b8e986;color:#111c14;font-weight:700;cursor:pointer;">Retry Connection</button>' +
              '<a href="../" style="padding:9px 14px;border-radius:9px;border:1px solid #3d5245;color:#eef3ea;text-decoration:none;font-weight:600;">← Back to Portfolio</a>' +
              '</div></div>';
          });
      })();
    </script>
  </body>
</html>
