<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found — Blake Pember</title>
  <script>
    // Forward legacy subpath URLs to each project's dedicated Cloudflare Workers subdomain
    (function () {
      var path = window.location.pathname;
      var suffix = window.location.search + window.location.hash;
      var redirects = [
        { prefix: '/duckhouse', target: 'https://duckhouse.blakepember.net' },
        { prefix: '/trivia', target: 'https://trivia.blakepember.net' },
        { prefix: '/language', target: 'https://fala.blakepember.net' },
        { prefix: '/fala', target: 'https://fala.blakepember.net' },
      ];
      for (var i = 0; i < redirects.length; i++) {
        var r = redirects[i];
        if (path === r.prefix || path.indexOf(r.prefix + '/') === 0) {
          var rest = path.slice(r.prefix.length) || '/';
          window.location.replace(r.target + rest + suffix);
          return;
        }
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #171d19;
      color: #eff2e9;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      text-align: center;
      background: #202822;
      border: 1px solid #343e36;
      border-radius: 16px;
      padding: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 20px; color: #a7afa4; line-height: 1.5; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .primary { background: #d3ef8b; color: #171d19; }
    .secondary { border: 1px solid #49574b; color: #eff2e9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404 — Page Not Found</h1>
    <p>That page doesn’t exist on blakepember.net.</p>
    <div class="actions">
      <a class="primary" href="/">Back to Portfolio</a>
      <a class="secondary" href="https://duckhouse.blakepember.net/">Play Duckhouse</a>
      <a class="secondary" href="https://trivia.blakepember.net/">Play Trivia</a>
      <a class="secondary" href="https://fala.blakepember.net/">Learn Portuguese</a>
    </div>
  </div>
</body>
</html>
