<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found — Blake Pember</title>
  <script>
    // GitHub Pages SPA fallback for clean Duckhouse and Trivia URLs (e.g. /duckhouse/room/ABC123, /trivia/practice)
    (function () {
      var path = window.location.pathname;
      if (path === '/duckhouse' || path.indexOf('/duckhouse/') === 0) {
        try {
          sessionStorage.setItem('duckhouse_redirect', path + window.location.search);
        } catch (e) {}
        window.location.replace('/duckhouse/');
      } else if (path === '/trivia' || path.indexOf('/trivia/') === 0) {
        try {
          sessionStorage.setItem('trivia_redirect', path + window.location.search);
        } catch (e) {}
        window.location.replace('/trivia/');
      } else if (path === '/language' || path.indexOf('/language/') === 0) {
        try {
          sessionStorage.setItem('language_redirect', path + window.location.search);
        } catch (e) {}
        window.location.replace('/language/');
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #171d19;
      color: #eff2e9;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      text-align: center;
      background: #202822;
      border: 1px solid #343e36;
      border-radius: 16px;
      padding: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 20px; color: #a7afa4; line-height: 1.5; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .primary { background: #d3ef8b; color: #171d19; }
    .secondary { border: 1px solid #49574b; color: #eff2e9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404 — Page Not Found</h1>
    <p>That page doesn’t exist on blakepember.net.</p>
    <div class="actions">
      <a class="primary" href="/">Back to Portfolio</a>
      <a class="secondary" href="/duckhouse/">Play Duckhouse</a>
      <a class="secondary" href="/trivia/">Play Trivia</a>
      <a class="secondary" href="/language/">Learn Portuguese</a>
    </div>
  </div>
</body>
</html>
