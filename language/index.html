<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fala! — Interactive Brazilian Portuguese learning site with guided lessons, spaced repetition flashcards, verb drills, real dialogues, and pronunciation audio."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fala! — Learn Brazilian Portuguese</title>
    <script>
      // Restore clean SPA routes redirected via GitHub Pages 404.html (e.g. /language/flashcards)
      (function () {
        try {
          var saved = sessionStorage.getItem('language_redirect');
          if (saved) {
            sessionStorage.removeItem('language_redirect');
            if (saved.indexOf('/language') === 0) {
              history.replaceState(null, '', saved);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Dev helper: when opened via VS Code Live Server (static file server) instead of Vite,
      // automatically forward to the local Vite dev server on port 5175.
      (function () {
        var isRawViteEntry = !!document.querySelector('script[src="/src/main.tsx"]');
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!isRawViteEntry || !isLocal || location.port === '5175') return;

        var relPath = location.pathname
          .replace(/^\/language\/?/i, '/')
          .replace(/\/index\.html$/i, '/');
        if (!relPath.startsWith('/')) relPath = '/' + relPath;
        var devOrigin = 'http://localhost:5175';
        var devUrl = devOrigin + relPath;
        fetch(devOrigin + '/favicon.svg')
          .then(function (r) {
            if (r.ok) location.replace(devUrl);
            else throw new Error('not ready');
          })
          .catch(function () {
            document.body.style.cssText =
              'margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e1714;color:#eff5f1;font-family:system-ui,sans-serif;padding:24px;';
            document.getElementById('root').innerHTML =
              '<div style="max-width:480px;background:#15221d;border:1px solid #294037;border-radius:16px;padding:24px;line-height:1.6;">' +
              '<h2 style="margin:0 0 8px;">Fala! Dev Server Not Running</h2>' +
              '<p style="margin:0 0 14px;color:#9eb5ab;">Fala! is a React + TypeScript Vite app, so VS Code Live Server cannot compile <code>.tsx</code> files directly.</p>' +
              '<p style="margin:0 0 14px;">Run this command in your terminal, then click Retry:</p>' +
              '<pre style="background:#0e1714;padding:10px 12px;border-radius:8px;overflow:auto;color:#34d399;">cd language\nnpm run dev</pre>' +
              '<div style="display:flex;gap:10px;margin-top:16px;">' +
              '<button onclick="location.reload()" style="padding:9px 14px;border-radius:9px;border:none;background:#34d399;color:#082016;font-weight:700;cursor:pointer;">Retry Connection</button>' +
              '<a href="../" style="padding:9px 14px;border-radius:9px;border:1px solid #355447;color:#eff5f1;text-decoration:none;font-weight:600;">← Back to Portfolio</a>' +
              '</div></div>';
          });
      })();
    </script>
  </body>
</html>
