# Build Duckhouse React app and deploy static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "duckhouse/package-lock.json"
      - name: Build Duckhouse React Frontend
        working-directory: duckhouse
        env:
          VITE_SERVER_URL: ${{ vars.DUCKHOUSE_SERVER_URL || 'https://duckhouse-api.blakepember.workers.dev' }}
        run: |
          npm ci
          npm run build
      - name: Assemble GitHub Pages Site
        run: |
          mkdir -p _site
          cp index.html styles.css Blake-Pember-Resume.pdf CNAME _site/ 2>/dev/null || true
          cp -r icons images learn pieces-basic-svg _site/ 2>/dev/null || true
          mkdir -p _site/duckhouse
          cp -r duckhouse/.cloudflare/output/v1/workers/default/assets/* _site/duckhouse/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
