# Run unit tests, typechecks, and production builds before merging into main
name: CI — Unit Tests & Build

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivia-ci:
    name: Trivia — Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trivia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "trivia/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck & build
        run: npm run build

  duckhouse-ci:
    name: Duckhouse — Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duckhouse
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "duckhouse/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck & build
        run: npm run build

  ci-gate:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [trivia-ci, duckhouse-ci]
    if: always()
    steps:
      - name: Verify all test suites passed
        run: |
          if [[ "${{ needs.trivia-ci.result }}" != "success" || "${{ needs.duckhouse-ci.result }}" != "success" ]]; then
            echo "One or more CI checks failed:"
            echo "  trivia-ci:    ${{ needs.trivia-ci.result }}"
            echo "  duckhouse-ci: ${{ needs.duckhouse-ci.result }}"
            exit 1
          fi
          echo "All unit tests and builds passed!"
